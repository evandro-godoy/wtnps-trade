# ===================================================================
# CONFIGURAÇÕES GLOBAIS DO FRAMEWORK
# ===================================================================

global_settings:
  # Diretório para salvar os modelos treinados. Os arquivos serão nomeados com o ticker.
  model_directory: "c:/projects/wtnps-trade/models"

  # Nomes dos arquivos de relatório (use {ticker} para substituição automática).
  reporting:
    performance_report_path: "c:/projects/reports/{ticker}_performance_report.html"
    trades_report_path: "c:/projects/reports/{ticker}_trades_report.html"


# ===================================================================
# LISTA DE ATIVOS PARA OPERAÇÃO
# Cada item é uma configuração completa e independente para um ativo.
# ===================================================================

assets:
  - ticker: "WDO$"
    enabled: true  # Habilita ou desabilita este ativo para treino e live trading.
    provider: "MetaTrader5"
    strategy_module: "lstm"
    strategy_name: "LSTMStrategy"
    
    data:
      in_sample:
        start_date: "2023-01-01"
        end_date: "2025-09-30"
      out_of_sample:
        start_date: "2025-10-01"
        end_date: "2025-10-08"

    trading_rules:
      initial_capital: 5000
      stop_loss_pct: 0.02
      take_profit_pct: 0.05
    
    live_trading:
      ticker_order: "WDOX25"
      timeframe_str: "M5" # Timeframe para este ativo (M1, M5, H1, D1, etc.)
      execution_mode: "suggest" # "suggest" ou "execute"
      trade_volume: 1.0       # quantidade de contratos

  - ticker: "WIN$"
    enabled: true
    provider: "MetaTrader5"
    strategy_module: "lstm"
    strategy_name: "LSTMStrategy"
    
    data:
      in_sample:
        start_date: "2023-01-01"
        end_date: "2025-09-30"
      out_of_sample:
        start_date: "2025-10-01"
        end_date: "2025-10-08"

    trading_rules:
      initial_capital: 5000
      stop_loss_pct: 0.02
      take_profit_pct: 0.05
      
    live_trading:
      ticker_order: "WINV25"
      timeframe_str: "M15"
      execution_mode: "suggest"
      trade_volume: 2.0  # quantidade de contratos  

    setup:
      - condition: 'buy'  # Esta regra só se aplica se o sinal da IA for de COMPRA
        type: 'price_above_ema' # Critério: O preço deve estar acima da Média Móvel Exponencial
        period: 21              # Período da EMA
      
      - condition: 'sell' # Esta regra só se aplica se o sinal da IA for de VENDA
        type: 'price_below_ema' # Critério: O preço deve estar abaixo da Média Móvel Exponencial
        period: 21        # Período da EMA

    setup:
      - condition: 'buy'
        type: 'price_above_ema'
        period: 9
      - condition: 'buy'
        type: 'rsi_above' # Exemplo de regra adicional: RSI também deve estar acima de 50
        period: 14
        level: 50

      - condition: 'sell'
        type: 'price_below_ema'
        period: 9

    setup:
      - condition: 'buy'
        type: 'price_above_ema'
        period: 9
      - condition: 'buy'
        type: 'rsi_above' # Exemplo de regra adicional: RSI também deve estar acima de 50
        period: 14
        level: 50

      - condition: 'sell'
        type: 'price_below_ema'
        period: 9      
       