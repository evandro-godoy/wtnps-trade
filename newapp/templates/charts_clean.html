<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>WTNPS Trade - Gráficos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/static/css/style.css?v=clean2" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Bokeh for charts -->
  <link rel="stylesheet" href="https://cdn.bokeh.org/bokeh/release/bokeh-3.8.1.min.css">
  <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.8.1.min.js"></script>
</head>
<body class="layout-with-sidebar charts-clean">
  <!-- Sidebar (apenas ícones) -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-logo" title="WTNPS Trade">
        <i class="fas fa-chart-line"></i>
        <span>WTNPS</span>
      </h2>
    </div>
    <ul class="sidebar-menu">
      <li class="menu-item"><a href="/home-clean"><i class="fas fa-home"></i><span>Home</span></a></li>
      <li class="menu-item active"><a href="/charts-clean"><i class="fas fa-chart-line"></i><span>Gráficos</span></a></li>
      <li class="menu-item"><a><i class="fas fa-tv"></i><span>Monitor</span></a></li>
      <li class="menu-item"><a><i class="fas fa-brain"></i><span>Análise</span></a></li>
      <li class="menu-item"><a><i class="fas fa-clock-rotate-left"></i><span>Backtest</span></a></li>
      <li class="menu-item"><a><i class="fas fa-gear"></i><span>Configurações</span></a></li>
    </ul>
    <div class="sidebar-footer"></div>
  </nav>

  <!-- Main Content com gráfico apenas -->
  <main class="main-content">
    <header class="page-header">
      <h1>
        <i class="fas fa-chart-line"></i>
        Gráficos
      </h1>
      <div class="header-actions">
        <div class="controls-group">
          <select id="symbol-selector" class="form-select">
            <option value="WDO$" selected>WDO$</option>
            <option value="WIN$">WIN$</option>
          </select>
          
          <select id="timeframe-selector" class="form-select">
            <option value="M1">M1</option>
            <option value="M5" selected>M5</option>
            <option value="M15">M15</option>
            <option value="M30">M30</option>
            <option value="H1">H1</option>
            <option value="H4">H4</option>
            <option value="D1">D1</option>
          </select>
          
          <select id="limit-selector" class="form-select">
            <option value="100">100</option>
            <option value="250">250</option>
            <option value="500" selected>500</option>
            <option value="1000">1000</option>
          </select>
          
          <button id="refresh-chart" class="btn btn-primary">
            <i class="fas fa-sync"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="content-wrapper">
      <!-- Apenas o gráfico, sem cards de análise -->
      <section class="chart-section">
        <div class="chart-card">
          <div class="chart-container">
            {{ bokeh_div | safe }}
          </div>
        </div>
      </section>
      
      <!-- Grid de Predições ML com Análise Técnica -->
      <section class="predictions-section">
        <!-- Notebook com 2 tabs: Sinais ML e Análise Técnica -->
        <div class="predictions-card">
          <div class="predictions-header">
            <h3><i class="fas fa-brain"></i> Monitor em Tempo Real</h3>
            <div class="header-controls">
              <button id="refresh-predictions" class="btn btn-sm">
                <i class="fas fa-sync"></i>
              </button>
              <button id="clear-logs" class="btn btn-sm btn-danger">
                <i class="fas fa-trash"></i> Limpar
              </button>
            </div>
          </div>
          
          <!-- Tabs Navigation -->
          <div class="tabs-container">
            <div class="tabs-nav">
              <button class="tab-btn active" data-tab="ml-signals">
                <i class="fas fa-chart-line"></i> Sinais ML
              </button>
              <button class="tab-btn" data-tab="technical">
                <i class="fas fa-chart-bar"></i> Análise Técnica
              </button>
            </div>
            
            <!-- Tab Content: Sinais ML -->
            <div id="ml-signals" class="tab-content active">
              <div class="predictions-table-container">
                <table id="predictions-table" class="predictions-table">
                  <thead>
                    <tr>
                      <th>Data/Hora</th>
                      <th>Tipo</th>
                      <th>Preço</th>
                      <th>Prob. ML (%)</th>
                      <th>Mensagem</th>
                    </tr>
                  </thead>
                  <tbody id="predictions-body">
                    <tr>
                      <td colspan="5" style="text-align: center; color: #76838f;">Carregando predições...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            
            <!-- Tab Content: Análise Técnica -->
            <div id="technical" class="tab-content">
              <div class="predictions-table-container">
                <table id="analysis-table" class="predictions-table">
                  <thead>
                    <tr>
                      <th>Data/Hora</th>
                      <th>Tendência</th>
                      <th>RSI</th>
                      <th>EMA9</th>
                      <th>SMA20</th>
                      <th>SMA50</th>
                    </tr>
                  </thead>
                  <tbody id="analysis-body">
                    <tr>
                      <td colspan="6" style="text-align: center; color: #76838f;">Carregando análises...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Embed Bokeh Script -->
  {{ bokeh_script | safe }}
  
  <script>
    // Chart refresh logic
    document.getElementById('refresh-chart')?.addEventListener('click', () => {
      const symbol = document.getElementById('symbol-selector')?.value || 'WDO$';
      const timeframe = document.getElementById('timeframe-selector')?.value || 'M5';
      const limit = document.getElementById('limit-selector')?.value || '500';
      window.location.href = `/charts-clean?symbol=${symbol}&timeframe=${timeframe}&limit=${limit}`;
    });
    
    document.getElementById('symbol-selector')?.addEventListener('change', () => {
      document.getElementById('refresh-chart').click();
    });
    document.getElementById('timeframe-selector')?.addEventListener('change', () => {
      document.getElementById('refresh-chart').click();
    });
    document.getElementById('limit-selector')?.addEventListener('change', () => {
      document.getElementById('refresh-chart').click();
    });
    
    // ========== TABS NAVIGATION ==========
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        // Remove active from all
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        
        // Add active to clicked
        btn.classList.add('active');
        const tabId = btn.getAttribute('data-tab');
        document.getElementById(tabId)?.classList.add('active');
      });
    });
    
    // ========== STATE MANAGEMENT ==========
    let lastCandleTime = null;
    let autoRefreshInterval = null;
    let isMarketOpen = false;
    let predictionHistory = []; // Store all predictions with technical data
    
    // Get timeframe in seconds for interval calculation
    function getTimeframeSeconds(tf) {
      const mapping = {
        'M1': 60, 'M5': 300, 'M15': 900, 'M30': 1800,
        'H1': 3600, 'H4': 14400, 'D1': 86400
      };
      return mapping[tf] || 300;
    }
    
    // Format timestamp to local timezone
    function formatTimestamp(isoString) {
      const date = new Date(isoString);
      return date.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    
    // Calculate technical indicators from prediction data
    function extractTechnicalData(pred) {
      const indicators = pred.indicators || {};
      
      return {
        timestamp: pred.timestamp,
        trend: getTrend(indicators),
        trend_strength: getTrendStrength(indicators),
        rsi: indicators.rsi_14 || 0,
        rsi_condition: getRSICondition(indicators.rsi_14 || 0),
        ema9: indicators.ema_9 || 0,
        sma20: indicators.sma_20 || 0,
        sma50: indicators.sma_50 || 0
      };
    }
    
    // Determine trend from indicators
    function getTrend(indicators) {
      const close = indicators.close || 0;
      const ema9 = indicators.ema_9 || 0;
      const sma20 = indicators.sma_20 || 0;
      
      if (!close || !ema9 || !sma20) return 'N/A';
      
      if (ema9 > sma20 && close > ema9) return 'ALTA';
      if (ema9 < sma20 && close < ema9) return 'BAIXA';
      return 'LATERAL';
    }
    
    // Determine trend strength
    function getTrendStrength(indicators) {
      const sma20 = indicators.sma_20 || 0;
      const sma50 = indicators.sma_50 || 0;
      
      if (!sma20 || !sma50) return 'N/A';
      
      const slope = Math.abs((sma50 - sma20) / sma20 * 100);
      
      if (slope > 1.0) return 'FORTE';
      if (slope > 0.3) return 'MODERADA';
      return 'FRACA';
    }
    
    // Determine RSI condition
    function getRSICondition(rsi) {
      if (rsi > 70) return 'SOBRECOMPRADO';
      if (rsi < 30) return 'SOBREVENDIDO';
      return 'NEUTRO';
    }
    
    // Format trend display with strength
    function formatTrend(trend, strength) {
      if (trend === 'N/A') return 'N/A';
      
      let icon = '';
      let color = '#95a5a6';
      
      if (trend === 'ALTA') {
        icon = '▲';
        color = '#2ecc71';
      } else if (trend === 'BAIXA') {
        icon = '▼';
        color = '#e74c3c';
      } else {
        icon = '⬌';
        color = '#f39c12';
      }
      
      return `<span style="color: ${color}; font-weight: 600;">${icon} ${trend}</span><br><span style="font-size: 10px; color: #76838f;">${strength}</span>`;
    }
    
    // Format RSI display with condition
    function formatRSI(rsi, condition) {
      if (!rsi || rsi === 0) return 'N/A';
      
      let color = '#95a5a6';
      if (condition === 'SOBRECOMPRADO') color = '#e74c3c';
      else if (condition === 'SOBREVENDIDO') color = '#2ecc71';
      
      return `<span style="font-weight: 600;">${rsi.toFixed(0)}</span><br><span style="font-size: 10px; color: ${color};">${condition}</span>`;
    }
    
    // ========== LOAD PREDICTIONS ==========
    async function loadPredictions() {
      try {
        const symbol = document.getElementById('symbol-selector')?.value || 'WDO$';
        const timeframe = document.getElementById('timeframe-selector')?.value || 'M5';
        
        const response = await fetch(`/api/monitor-predictions?symbol=${symbol}&timeframe=${timeframe}&count=10`);
        const data = await response.json();
        
        console.log('📊 API Response:', {
          predictions_count: data.predictions?.length || 0,
          latest_candle: data.latest_candle_time,
          is_market_open: data.is_market_open,
          source: data.source,
          error: data.error
        });
        
        // Log first prediction for debugging
        if (data.predictions && data.predictions.length > 0) {
          console.log('📈 First prediction:', data.predictions[0]);
        }
        
        const mlBody = document.getElementById('predictions-body');
        const analysisBody = document.getElementById('analysis-body');
        
        // Update market status
        isMarketOpen = data.is_market_open || false;
        
        // Check if new candle arrived
        const newCandleTime = data.latest_candle_time;
        const hasNewCandle = newCandleTime && newCandleTime !== lastCandleTime;
        
        if (hasNewCandle) {
          console.log(`🕯️ New candle detected: ${newCandleTime}`);
          lastCandleTime = newCandleTime;
        }
        
        if (data.predictions && data.predictions.length > 0) {
          // Store predictions in history (prepend new ones)
          data.predictions.forEach(pred => {
            // Check if not already in history
            const exists = predictionHistory.find(p => p.timestamp === pred.timestamp);
            if (!exists) {
              predictionHistory.unshift(pred);
            }
          });
          
          // Limit history to 50 items
          predictionHistory = predictionHistory.slice(0, 50);
          
          // ===== POPULATE ML SIGNALS TAB =====
          mlBody.innerHTML = '';
          predictionHistory.forEach(pred => {
            const row = document.createElement('tr');
            
            // Determine signal type and class
            let tipoClass = 'neutral';
            let tipoText = pred.tipo || 'N/A';
            
            if (tipoText === 'COMPRA') {
              tipoClass = 'buy';
            } else if (tipoText === 'VENDA') {
              tipoClass = 'sell';
            }
            
            // Format timestamp
            const formattedTime = formatTimestamp(pred.timestamp);
            
            // Determine row tag based on probability
            let rowTag = '';
            const prob = pred.prob_ml || 0;
            
            if (prob >= 65) {
              rowTag = 'ALERT';
            } else if (prob >= 55) {
              rowTag = 'INFO';
            } else {
              rowTag = 'TICK';
            }
            
            row.className = `log-row log-${rowTag.toLowerCase()}`;
            
            // Format price
            const preco = pred.preco || 0;
            const precoStr = preco.toLocaleString('pt-BR');
            
            row.innerHTML = `
              <td>${formattedTime}</td>
              <td><span class="signal-badge signal-${tipoClass}">${tipoText}</span></td>
              <td>${precoStr}</td>
              <td><span class="prob-badge prob-${getProbClass(prob)}">${prob.toFixed(1)}%</span></td>
              <td>${pred.mensagem || 'N/A'}</td>
            `;
            
            mlBody.appendChild(row);
          });
          
          // ===== POPULATE TECHNICAL ANALYSIS TAB =====
          analysisBody.innerHTML = '';
          predictionHistory.forEach(pred => {
            const row = document.createElement('tr');
            const tech = extractTechnicalData(pred);
            
            const formattedTime = formatTimestamp(tech.timestamp);
            
            // Determine row tag
            let rowTag = '';
            const prob = pred.prob_ml || 0;
            
            if (prob >= 65) {
              rowTag = 'ALERT';
            } else if (prob >= 55) {
              rowTag = 'INFO';
            } else {
              rowTag = 'TICK';
            }
            
            row.className = `log-row log-${rowTag.toLowerCase()}`;
            
            row.innerHTML = `
              <td>${formattedTime}</td>
              <td>${formatTrend(tech.trend, tech.trend_strength)}</td>
              <td>${formatRSI(tech.rsi, tech.rsi_condition)}</td>
              <td>${tech.ema9 > 0 ? tech.ema9.toFixed(0) : 'N/A'}</td>
              <td>${tech.sma20 > 0 ? tech.sma20.toFixed(0) : 'N/A'}</td>
              <td>${tech.sma50 > 0 ? tech.sma50.toFixed(0) : 'N/A'}</td>
            `;
            
            analysisBody.appendChild(row);
          });
          
        } else {
          mlBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #76838f;">Nenhuma predição disponível</td></tr>';
          analysisBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #76838f;">Nenhuma análise disponível</td></tr>';
        }
        
        // Update status indicator in header
        updateMarketStatus(isMarketOpen, newCandleTime);
        
      } catch (error) {
        console.error('Error loading predictions:', error);
        const mlBody = document.getElementById('predictions-body');
        const analysisBody = document.getElementById('analysis-body');
        mlBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #e74c3c;">Erro ao carregar predições</td></tr>';
        analysisBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #e74c3c;">Erro ao carregar análises</td></tr>';
      }
    }
    
    // Helper: Get probability class for color coding
    function getProbClass(prob) {
      if (prob >= 75) return 'high';
      if (prob >= 65) return 'medium-high';
      if (prob >= 55) return 'medium';
      return 'low';
    }
    
    // ========== CLEAR LOGS ==========
    function clearLogs() {
      predictionHistory = [];
      document.getElementById('predictions-body').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #76838f;">Logs limpos</td></tr>';
      document.getElementById('analysis-body').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #76838f;">Logs limpos</td></tr>';
      console.log('📋 Logs cleared');
    }
    
    document.getElementById('clear-logs')?.addEventListener('click', clearLogs);
    
    // ========== MARKET STATUS ==========
    function updateMarketStatus(isOpen, lastCandle) {
      const header = document.querySelector('.predictions-header h3');
      if (!header) return;
      
      // Remove existing status
      const existingStatus = header.querySelector('.market-status');
      if (existingStatus) existingStatus.remove();
      
      // Add new status
      const statusSpan = document.createElement('span');
      statusSpan.className = 'market-status';
      statusSpan.style.cssText = `
        font-size: 11px;
        margin-left: 8px;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: 500;
      `;
      
      if (isOpen) {
        statusSpan.textContent = '● Live';
        statusSpan.style.color = '#2ecc71';
        statusSpan.style.backgroundColor = 'rgba(46, 204, 113, 0.15)';
      } else {
        statusSpan.textContent = '● Fechado';
        statusSpan.style.color = '#95a5a6';
        statusSpan.style.backgroundColor = 'rgba(149, 165, 166, 0.15)';
      }
      
      header.appendChild(statusSpan);
    }
    
    // ========== AUTO-REFRESH ==========
    function setupAutoRefresh() {
      // Clear existing interval
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
      }
      
      // Only auto-refresh if market is open
      if (!isMarketOpen) {
        console.log('⏸️ Market closed, auto-refresh paused');
        return;
      }
      
      const timeframe = document.getElementById('timeframe-selector')?.value || 'M5';
      const intervalSeconds = getTimeframeSeconds(timeframe);
      
      // Poll every 5 seconds to detect new candles
      const pollInterval = 5000;
      
      console.log(`🔄 Auto-refresh enabled: checking every ${pollInterval/1000}s for new ${timeframe} candles`);
      
      autoRefreshInterval = setInterval(async () => {
        if (!isMarketOpen) {
          clearInterval(autoRefreshInterval);
          console.log('⏸️ Market closed, stopping auto-refresh');
          return;
        }
        
        await loadPredictions();
      }, pollInterval);
    }
    
    // ========== EVENT LISTENERS ==========
    // Refresh predictions button
    document.getElementById('refresh-predictions')?.addEventListener('click', () => {
      loadPredictions();
      setupAutoRefresh();
    });
    
    // Load predictions on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadPredictions().then(() => {
        setupAutoRefresh();
      });
    });
    
    // Restart auto-refresh when timeframe changes
    document.getElementById('timeframe-selector')?.addEventListener('change', () => {
      setTimeout(() => {
        loadPredictions().then(() => {
          setupAutoRefresh();
        });
      }, 500);
    });
    
    document.getElementById('symbol-selector')?.addEventListener('change', () => {
      setTimeout(() => {
        loadPredictions().then(() => {
          setupAutoRefresh();
        });
      }, 500);
    });
  </script>
</body>
