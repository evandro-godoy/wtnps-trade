<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>WTNPS Trade - Home Clean</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/static/css/style.css?v=clean1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>
<body class="layout-with-sidebar home-clean">
    <!-- Sidebar (cores e layout iguais à home) -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-logo" title="WTNPS Trade Sandbox">
                <i class="fas fa-chart-line"></i>
                <span>WTNPS</span>
            </h2>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item active"><a href="/home-clean"><i class="fas fa-home"></i><span>Home</span></a></li>
            <li class="menu-item"><a href="/charts-clean"><i class="fas fa-chart-line"></i><span>Gráficos</span></a></li>
            <li class="menu-item"><a><i class="fas fa-tv"></i><span>Monitor</span></a></li>
            <li class="menu-item"><a><i class="fas fa-brain"></i><span>Análise</span></a></li>
            <li class="menu-item"><a><i class="fas fa-clock-rotate-left"></i><span>Backtest</span></a></li>
            <li class="menu-item"><a><i class="fas fa-gear"></i><span>Configurações</span></a></li>
        </ul>
        <div class="sidebar-footer"></div>
    </nav>

    <!-- Main Content Area vazio e mais escuro que o menu -->
    <main class="main-content"></main>
</body>
<style>
    /* Escopo apenas para a home-clean */
    .home-clean .sidebar { width: 80px; }
    .home-clean .main-content { margin-left: 80px; width: calc(100% - 80px); background: #101418; }
    /* Oculta textos dos itens de menu e centraliza ícones */
    .home-clean .menu-item a { justify-content: center; padding: 12px; }
    .home-clean .menu-item a span { display: none; }
    .home-clean .menu-item a i { font-size: 18px; }
    /* Ajusta logo para caber no menu mais estreito */
    .home-clean .sidebar-logo span { display: none; }
    .home-clean .sidebar-logo { justify-content: center; }
    /* Remove qualquer padding extra do footer */
    .home-clean .sidebar-footer { padding: 10px; }
</style>
</html>
