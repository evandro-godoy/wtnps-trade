    "numpy (>=2.3.3,<3.0.0)",
    "yfinance (>=0.2.66,<0.3.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "plotly (>=6.3.0,<7.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "tensorflow (>=2.20.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "metatrader5 (>=5.0.5260,<6.0.0)",
